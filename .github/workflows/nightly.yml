# M2 nightly: SEC refresh, prices for the last 14 days, checks, Tiingo spot check, live scores and paper verdicts
# (quant.live), records, backups.
# Weekdays 03:17 UTC = 10:17 pm CDT / 9:17 pm CST, after Yahoo fills in the day's closes (about 02:20 UTC, docs/M2.md). Every step is
# safe to rerun.
name: nightly
run-name: ${{ inputs.by == 'cron' && 'nightly (scheduled)' || 'nightly' }}

on:  # started by the Cloudflare scheduler (worker/src/scheduler.ts) with by=cron, or by hand
  workflow_dispatch:
    inputs:
      by:
        description: "Who started it: cron means the Cloudflare scheduler (counts as scheduled)"
        type: string
        default: ""
      first_run:
        description: "Create db/app.sqlite (only if R2 has none)"
        type: boolean
        default: false

concurrency:
  group: r2-writer
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # the broken-app count reads this repo's run history

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Check secrets
        run: |
          for v in SEC_USER_AGENT TIINGO_API_KEY BACKUP_DEPLOY_KEY R2_ACCOUNT_ID BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is missing or empty"; exit 1; }
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q tests/
      - name: Inputs from R2
        run: |
          r2="--endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com --only-show-errors"
          for f in price_plan ticker_map companies; do aws s3 cp "s3://$BUCKET/market/$f.parquet" "out/market/$f.parquet" $r2; done
          # from 2025: the paper replay (quant.live) needs prices from 400 days before its first month-end
          y=$(date -u +%Y); for yy in $(seq 2025 $y); do aws s3 sync "s3://$BUCKET/market/prices/year=$yy" "out/market/prices/year=$yy" $r2; done
          aws s3 sync "s3://$BUCKET/inbox" out/inbox $r2 --exclude "processed/*"
          aws s3 sync "s3://$BUCKET/market/universe" out/market/universe $r2
          aws s3 sync "s3://$BUCKET/market/scores/month_end" out/market/scores/month_end $r2
          # last night's scores, paper state and panel views, so the site still builds if scoring can't run tonight
          aws s3 cp "s3://$BUCKET/market/scores/latest.parquet" out/market/scores/latest.parquet $r2 || true
          aws s3 sync "s3://$BUCKET/market/paper" out/market/paper $r2
          aws s3 sync "s3://$BUCKET/market/panel" out/market/panel $r2
          aws s3 sync "s3://$BUCKET/market/quality/daily" out/market/quality/daily $r2
          aws s3 cp "s3://$BUCKET/logs/restore/latest.json" out/logs/restore/latest.json $r2 || true
          aws s3 cp "s3://$BUCKET/backups/monthly/$(date -u +%Y-%m).sqlite" "out/backups/monthly/$(date -u +%Y-%m).sqlite" $r2 || true
          if aws s3 ls "s3://$BUCKET/db/app.sqlite" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" >/dev/null; then
            aws s3 cp "s3://$BUCKET/db/app.sqlite" out/db/app.sqlite $r2; echo "FIRST=" >> "$GITHUB_ENV"
          elif [ "${{ inputs.first_run }}" = "true" ]; then echo "FIRST=--first-run" >> "$GITHUB_ENV"
          else echo "::error::R2 has no db/app.sqlite; run once by hand with first_run"; exit 1; fi
      - name: SEC refresh (submissions, 8-Ks, fundamentals)
        id: sec
        continue-on-error: true
        run: python -m pipeline.sec out && python -m pipeline.fundamentals out
      - name: Prices, last 14 days
        id: prices
        continue-on-error: true
        run: python -m pipeline.daily out prices
      - name: Checks on the new days
        id: checks
        continue-on-error: true
        run: python -m pipeline.daily out checks
      - name: Spot check against Tiingo
        id: spot
        continue-on-error: true
        run: python -m pipeline.daily out spotcheck
      - name: Scores and paper verdicts (frozen design, latest day only)
        id: scores
        if: steps.sec.outcome == 'success' && steps.prices.outcome == 'success' && steps.checks.outcome == 'success'
        continue-on-error: true
        run: python -m quant.live out
      - name: Records and backups
        id: records
        run: python -m pipeline.backup out nightly $FIRST
      - name: GitHub's run history (the broken-app count, monitor/failures.py)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-31 days' +%F); mkdir -p out/logs
          for w in nightly watch weekly restore prices; do
            gh run list -R "$GITHUB_REPOSITORY" -w "$w.yml" --created ">=$since" -L 1000 \
              --json workflowName,displayTitle,event,status,conclusion,createdAt,url
          done | jq -s add > "$RUNNER_TEMP/actions.json" && mv "$RUNNER_TEMP/actions.json" out/logs/actions.json
      - name: Site data (checked against the contract)
        id: site
        if: always() && steps.records.outcome == 'success' && hashFiles('out/market/paper/state.json') != ''
        continue-on-error: true
        run: |
          blocked=""
          [ "${{ steps.checks.outcome }}" = "success" ] || blocked="Tonight's data checks didn't pass, so there are no new scores or verdicts."
          python -m pipeline.site out "$blocked"
      - name: Save to R2
        id: save
        if: always()
        # Records first (irreplaceable), then market data, raw downloads last. Every upload retries; one that still
        # fails is reported and fails the step, but never stops the others (R2 once dropped a multipart upload of
        # submissions.zip, which used to skip the database upload). Inbox files move only once the database is saved.
        run: |
          set +e
          r2="--endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com --only-show-errors"
          fail=""
          try() { for i in 1 2 3; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 15)); done
                  echo "::error::upload failed after 3 tries: $*"; fail=1; return 1; }
          if [ "${{ steps.records.outcome }}" = "success" ] && try aws s3 cp out/db/app.sqlite "s3://$BUCKET/db/app.sqlite" $r2; then
            echo "db_saved=1" >> "$GITHUB_OUTPUT"
            try aws s3 sync out/backups "s3://$BUCKET/backups" $r2
            for f in out/inbox/*.json; do [ -e "$f" ] && try aws s3 mv "s3://$BUCKET/inbox/$(basename "$f")" "s3://$BUCKET/inbox/processed/$(basename "$f")" $r2; done
            for f in out/inbox/experiments/*.json; do [ -e "$f" ] && try aws s3 mv "s3://$BUCKET/inbox/experiments/$(basename "$f")" "s3://$BUCKET/inbox/processed/experiments/$(basename "$f")" $r2; done
            aws s3 ls "s3://$BUCKET/backups/daily/" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" | awk '{print $4}' | sort | head -n -30 | \
              while read k; do aws s3 rm "s3://$BUCKET/backups/daily/$k" $r2; done
          fi
          if [ "${{ steps.prices.outcome }}" = "success" ]; then
            for d in out/market/prices/year=*; do try aws s3 sync "$d" "s3://$BUCKET/market/prices/$(basename "$d")" --delete $r2; done
          fi
          if [ "${{ steps.sec.outcome }}" = "success" ]; then
            for f in companies filings_8k; do try aws s3 cp "out/market/$f.parquet" "s3://$BUCKET/market/$f.parquet" $r2; done
            try aws s3 cp out/market/fundamentals/facts.parquet "s3://$BUCKET/market/fundamentals/facts.parquet" $r2
          fi
          [ -d out/market/quality ] && try aws s3 sync out/market/quality "s3://$BUCKET/market/quality" $r2
          [ -d out/market/scores ] && try aws s3 sync out/market/scores "s3://$BUCKET/market/scores" $r2
          [ -d out/market/paper ] && try aws s3 sync out/market/paper "s3://$BUCKET/market/paper" $r2
          [ "${{ steps.site.outcome }}" = "success" ] && try aws s3 sync out/site "s3://$BUCKET/site" --delete $r2
          [ -d out/logs ] && try aws s3 sync out/logs "s3://$BUCKET/logs" $r2
          [ -d out/raw ] && try aws s3 sync out/raw "s3://$BUCKET/raw" $r2
          [ -z "$fail" ]
      - name: Deploy the site (Cloudflare Pages, behind Access)
        id: deploy
        if: steps.site.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'stockwatch' }}
        run: bash scripts/deploy_site.sh
      - name: Text export to the backup repo
        if: steps.save.outputs.db_saved == '1'
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$BACKUP_DEPLOY_KEY" > ~/.ssh/backup && chmod 600 ~/.ssh/backup
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/backup -o StrictHostKeyChecking=accept-new"
          repo=git@github.com:poojan-9603/StockWatchBackups.git
          git clone -q "$repo" bk 2>/dev/null || { mkdir bk && git -C bk init -q -b main && git -C bk remote add origin "$repo"; }
          cp out/backup_text/*.csv bk/
          cd bk && git add -A
          git diff --cached --quiet || git -c user.name=stockwatch-bot -c user.email=stockwatch-bot@users.noreply.github.com \
            commit -q -m "records $(date -u +%F)"
          git push -q origin HEAD:main
      - name: Run summary
        if: always()
        run: |
          f="out/logs/runs/$(date -u +%F).json"; [ -f "$f" ] && { echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          bad=""
          for s in "sec:${{ steps.sec.outcome }}" "prices:${{ steps.prices.outcome }}" "checks:${{ steps.checks.outcome }}" "spot:${{ steps.spot.outcome }}" "scores:${{ steps.scores.outcome }}" "site:${{ steps.site.outcome }}" "deploy:${{ steps.deploy.outcome }}"; do
            [ "${s#*:}" = "success" ] || bad="$bad ${s%%:*}"
          done
          [ -z "$bad" ] || { echo "::error::failed steps:$bad"; exit 1; }
