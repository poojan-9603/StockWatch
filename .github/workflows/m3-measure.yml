# M3 decision measurements on the 2013 to 2019 tuning years (the test-years lock stays on). Manual, read-only.
name: m3-measure

on: workflow_dispatch

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q tests/
      - name: Inputs from R2
        run: |
          r2="--endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com --only-show-errors"
          for f in ticker_map price_map price_gaps price_identity companies; do
            aws s3 cp "s3://$BUCKET/market/$f.parquet" "out/market/$f.parquet" $r2
          done
          aws s3 cp "s3://$BUCKET/market/fundamentals/facts.parquet" out/market/fundamentals/facts.parquet $r2
          aws s3 sync "s3://$BUCKET/raw/membership" out/raw/membership $r2
      - name: Measure
        run: python -m quant.measure out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-measure
          path: out/review/
          retention-days: 14
