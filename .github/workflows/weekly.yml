# The agent panel's weekly pass (agents.weekly): paper holdings and the shortlist, Haiku readers, Opus judge,
# Batch API. Sundays 15:17 UTC, clear of the nightly (weekdays) and the monthly prices job (Saturdays). Spends real
# API money (about $1.50 a week; agents.weekly refuses to start if the worst case passes its weekly budget).
name: weekly
run-name: ${{ inputs.by == 'cron' && 'weekly (scheduled)' || 'weekly' }}

on:  # started by the Cloudflare scheduler (worker/src/scheduler.ts) with by=cron, or by hand
  workflow_dispatch:
    inputs:
      by:
        description: "Who started it: cron means the Cloudflare scheduler (counts as scheduled)"
        type: string
        default: ""

concurrency:
  group: r2-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Check secrets
        run: |
          for v in SEC_USER_AGENT ANTHROPIC_API_KEY FINNHUB_API_KEY R2_ACCOUNT_ID BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is missing or empty"; exit 1; }
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q tests/
      - name: Inputs from R2
        run: |
          r2="--endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com --only-show-errors"
          aws s3 cp "s3://$BUCKET/db/app.sqlite" out/db/app.sqlite $r2
          aws s3 cp "s3://$BUCKET/market/scores/latest.parquet" out/market/scores/latest.parquet $r2
          aws s3 cp "s3://$BUCKET/market/filings_8k.parquet" out/market/filings_8k.parquet $r2
          aws s3 cp "s3://$BUCKET/market/fundamentals/facts.parquet" out/market/fundamentals/facts.parquet $r2
      - name: Panel
        id: panel
        run: python -m agents.weekly out
      - name: Records and the site file to R2
        if: always() && hashFiles('out/market/panel/latest.json') != ''
        run: |
          r2="--endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com --only-show-errors"
          aws s3 cp out/db/app.sqlite "s3://$BUCKET/db/app.sqlite" $r2
          aws s3 cp out/market/panel/latest.json "s3://$BUCKET/market/panel/latest.json" $r2
