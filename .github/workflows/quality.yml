# M1 step 6: data quality checks over the full history, on the market files already in R2. Manual, read-only
# except market/quality/. Fails if any block day is found; the review lists are uploaded either way.
name: quality

on: workflow_dispatch

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Check secrets
        run: |
          for v in R2_ACCOUNT_ID BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is missing or empty"; exit 1; }
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q tests/
      - name: Market files from R2
        run: |
          r2="--endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com --only-show-errors"
          aws s3 sync "s3://$BUCKET/market/prices" out/market/prices $r2
          for f in price_map ticker_map companies filings_8k; do
            aws s3 cp "s3://$BUCKET/market/$f.parquet" "out/market/$f.parquet" $r2
          done
          aws s3 cp "s3://$BUCKET/market/fundamentals/facts.parquet" out/market/fundamentals/facts.parquet $r2
          du -sh out/market/* | sort -h
      - name: Quality checks
        run: python -m pipeline.quality out
      - name: Save issues to R2
        if: always()
        run: |
          [ -f out/market/quality/issues.parquet ] || exit 0
          aws s3 cp out/market/quality/issues.parquet "s3://$BUCKET/market/quality/issues.parquet" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-outputs
          path: |
            out/market/quality/
            out/review/
          retention-days: 7
          if-no-files-found: ignore
